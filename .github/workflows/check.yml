name: 文档检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 链接与规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查相对链接与图片引用
        run: |
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            # 提取 [text](path) 与 ![alt](path) 中的本地路径
            while IFS= read -r tgt; do
              case "$tgt" in
                http*|mailto:*|tel:*|"#"*|"") continue ;;
              esac
              # 去掉锚点
              path="${tgt%%#*}"
              [ -z "$path" ] && continue
              if [ ! -e "$dir/$path" ]; then
                echo "::error file=$file::链接目标不存在 -> $tgt"
                fail=1
              fi
            done < <(grep -oP '\]\(\K[^)]+' "$file" 2>/dev/null || true)
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail

      - name: 检查单文件体积
        run: |
          fail=0
          limit=$((100 * 1024 * 1024))
          while IFS= read -r f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::文件超过 100MB，GitHub 会拒绝推送，请移至 Releases"
              fail=1
            fi
          done < <(find . -type f -not -path './.git/*')
          exit $fail

      - name: 检查 front matter
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in
              ./README.md) continue ;;
            esac
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::缺少 front matter"
              fail=1
              continue
            fi
            for key in title description; do
              if ! sed -n '2,/^---$/p' "$f" | grep -q "^${key}:"; then
                echo "::error file=$f::front matter 缺少 ${key}"
                fail=1
              fi
            done
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail

      - name: 检查图片命名规范
        run: |
          fail=0
          while IFS= read -r f; do
            name=$(basename "$f")
            if echo "$name" | grep -qP '[^\x00-\x7F]|[A-Z]| '; then
              echo "::error file=$f::图片文件名须为小写英文，例如 01-architecture-overview.png"
              fail=1
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -gt $((800 * 1024)) ]; then
              echo "::warning file=$f::图片 $((size / 1024))KB 偏大，建议压缩到 800KB 以内"
            fi
          done < <(find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -not -path './.git/*')
          exit $fail
